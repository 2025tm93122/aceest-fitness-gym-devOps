apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: a
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: a
        version: v3.1.2
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.1.2
          ports:
            - containerPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab
      variant: b
  template:
    metadata:
      labels:
        app: aceest-ab
        variant: b
        version: v3.2.4
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-a
  namespace: aceest
spec:
  selector:
    app: aceest-ab
    variant: a
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-b
  namespace: aceest
spec:
  selector:
    app: aceest-ab
    variant: b
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aceest-version-a-header
  namespace: aceest
spec:
  headers:
    customResponseHeaders:
      X-ACEest-Variant: "A"
      X-ACEest-Version: "v3.1.2"

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: aceest-version-b-header
  namespace: aceest
spec:
  headers:
    customResponseHeaders:
      X-ACEest-Variant: "B"
      X-ACEest-Version: "v3.2.4"

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aceest-ab-route
  namespace: aceest
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`) && Header(`X-Experiment`, `B`)
      kind: Rule
      priority: 20
      middlewares:
        - name: aceest-version-b-header
      services:
        - name: aceest-b
          port: 80

    - match: PathPrefix(`/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: aceest-version-a-header
      services:
        - name: aceest-a
          port: 80
