apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-stable
  namespace: aceest
  labels:
    strategy: canary
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest-canary
      track: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        track: stable
        version: v3.1.2
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.1.2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary-new
  namespace: aceest
  labels:
    strategy: canary
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        track: canary
        version: v3.2.4
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.2.4
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest
  labels:
    strategy: canary
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
    - port: 80
      targetPort: 5000
