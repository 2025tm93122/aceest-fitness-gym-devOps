apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: blue
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.1.2
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      slot: green
  template:
    metadata:
      labels:
        app: aceest-bg
        slot: green
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-bg
    slot: blue
  ports:
    - port: 80
      targetPort: 5000
