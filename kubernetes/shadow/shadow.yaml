apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-demo
      role: primary
  template:
    metadata:
      labels:
        app: aceest-shadow-demo
        role: primary
        version: v3.1.2
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.1.2
          ports:
            - containerPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-demo
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-shadow-demo
        role: shadow
        version: v3.2.4
    spec:
      containers:
        - name: aceest
          image: 2025tm93122/aceest-fitness:v3.2.4
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  selector:
    app: aceest-shadow-demo
    role: primary
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-shadow-demo
    role: shadow
  ports:
    - port: 80
      targetPort: 5000

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: primary-response-header
  namespace: aceest
spec:
  headers:
    customResponseHeaders:
      X-ACEest-Response-From: "PRIMARY-v3.1.2"

---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: aceest-mirror
  namespace: aceest
spec:
  mirroring:
    name: aceest-primary
    port: 80
    mirrorBody: true
    mirrors:
      - name: aceest-shadow
        port: 80
        percent: 100

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aceest-shadow-route
  namespace: aceest
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: primary-response-header
      services:
        - name: aceest-mirror
          kind: TraefikService
